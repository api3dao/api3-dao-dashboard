name: Continuous Build

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - production
      - dev

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Clone api3-dao-dashboard
        uses: actions/checkout@v6
      - name: Check hyperlinks
        uses: gaurav-nelson/github-action-markdown-link-check@v1

  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Clone api3-dao-dashboard
        uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install
      - name: Lint
        run: pnpm lint
      - name: Compile
        run: pnpm tsc
      - name: Test
        run: pnpm test

  cypress:
    runs-on: ubuntu-latest
    steps:
      - name: Clone api3-dao-dashboard
        uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install Dependencies
        run: |
          pnpm install
          pnpm cypress install
      - name: Prepare DAO contracts
        run: pnpm eth:prepare-dao-contracts-for-hardhat --github-actions
      - name: Use Node 16 for DAO contracts
        uses: actions/setup-node@v6
        with:
          node-version: 16
      - name: Bootstrap DAO contracts
        run: cd dao-contracts && npm run bootstrap
      - name: Restore to newer version of Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Cypress tests
        env:
          VITE_NODE_ENV: development
          VITE_PROJECT_ID: 8bddccf51318f114759f31306090233e
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          VITE_MAINNET_PROVIDER_URL: ${{ secrets.VITE_MAINNET_PROVIDER_URL }}
        run: pnpm percy exec -- pnpm ci:cypress
        timeout-minutes: 60
      - name: Store artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cypress-artifacts
          path: cypress/screenshots
          if-no-files-found: ignore
