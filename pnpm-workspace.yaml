allowBuilds:
  '@parcel/watcher': false
  '@percy/core': false
  core-js: false
  core-js-pure: false
  cypress: false
  keccak: false
  less: false

blockExoticSubdeps: true

minimumReleaseAge: 20160
minimumReleaseAgeExclude:
